<title>写作 Writing · 移动版</title>
<style>
  :root{
    --fg:#23272E; --fg-soft:#79818C; --fg-faint:#A8AEB8;
    --accent:#2F6FEB; --accent-soft:#EBF1FD; --line:#E9EBEF;
    --hover:#F2F4F7; --page:#F6F7F9; --paper:#FFFFFF;
    --git-m:#895503; --git-a:#587C0C; --git-d:#AD0707;
    --bar-h:auto; --kb:0px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--fg); background:var(--page);
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* ---------- 顶栏 ---------- */
  header{
    background:#fff; border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    flex:none; min-width:0;
  }
  .row{display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none;}
  .row::-webkit-scrollbar{display:none;}
  .row + .row{margin-top:8px;}
  button{
    font:inherit; font-size:13px; color:var(--fg);
    background:transparent; border:0; padding:8px 10px; border-radius:8px;
  }
  button:active{background:var(--hover);}
  button.on{background:var(--accent-soft); color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; padding:9px 14px;}
  button.primary:active{background:#2456BC;}
  .sep{width:1px; height:18px; background:var(--line); margin:0 4px;}
  .label{font-size:12px; color:var(--fg-soft); padding:0 2px;}
  .size{font-size:13px; font-weight:600; color:var(--accent); min-width:26px; text-align:center;}
  .sw{width:26px; height:26px; border-radius:50%; border:1.5px solid transparent; padding:0; position:relative;}
  .sw i{position:absolute; inset:2px; border-radius:50%; border:1px solid var(--line); display:block;}
  .sw.on{border-color:var(--accent);}
  .title{font-size:12px; color:var(--fg-faint); margin-left:auto; max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* ---------- 编辑区 ---------- */
  main{flex:1; min-height:0; padding:10px; display:flex;}
  #paper{
    flex:1; min-height:0; display:flex; border-radius:12px;
    background:var(--paper); border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(20,30,50,.05);
    overflow:hidden;
  }
  #editor{
    flex:1; border:0; outline:none; resize:none; background:transparent;
    color:#25282E; padding:18px 16px;
    font-family:inherit; font-size:19px; line-height:1.75;
    -webkit-text-size-adjust:100%;
  }
  /* ---------- 底栏 ---------- */
  footer{
    flex:none; min-width:0; max-width:100%;
    background:#fff; border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:10px; overflow-x:auto;
    font-size:11px; color:var(--fg-faint); white-space:nowrap;
    -webkit-overflow-scrolling:touch;
  }
  footer b{font-size:15px; color:var(--fg); font-weight:600;}
  footer b.speed{color:var(--accent);}
  /* ---------- 抽屉:稿件 / 统计 ---------- */
  .sheet{
    position:fixed; left:0; right:0; bottom:0; top:auto; max-height:72vh;
    background:#fff; border-top:1px solid var(--line); border-radius:14px 14px 0 0;
    box-shadow:0 -6px 24px rgba(20,30,50,.12);
    transform:translateY(105%); transition:transform .22s ease;
    display:flex; flex-direction:column; z-index:20;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h3{margin:0; padding:14px 16px 8px; font-size:14px; display:flex; align-items:center;}
  .sheet h3 button{margin-left:auto; font-size:13px; color:var(--fg-soft);}
  .sheet .body{padding:0 12px 16px; overflow:auto;}
  .doc{display:flex; align-items:center; gap:10px; padding:12px 8px; border-bottom:1px solid var(--line);}
  .doc .name{flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .doc .meta{font-size:11px; color:var(--fg-faint);}
  .doc.cur .name{color:var(--accent); font-weight:600;}
  .charline{display:flex; justify-content:space-between; padding:9px 8px; border-bottom:1px solid var(--line); font-size:14px;}
  .charline span:last-child{color:var(--fg-soft); font-size:12px;}
  .mask{position:fixed; inset:0; background:rgba(15,20,30,.28); opacity:0; pointer-events:none; transition:opacity .2s; z-index:10;}
  .mask.on{opacity:1; pointer-events:auto;}
  .hint{font-size:11px; color:var(--fg-faint); padding:2px 16px 10px;}
  .empty{padding:26px 8px; text-align:center; color:var(--fg-faint); font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="row">
    <button id="btnDocs">稿件</button>
    <button id="btnStats">输入统计</button>
    <button id="btnImport">导入 txt</button>
    <button id="btnExport">导出 txt</button>
    <span class="title" id="fileName">新稿件</span>
  </div>
  <div class="row">
    <button id="btnIndent" class="on">自动缩进</button>
    <span class="sep"></span>
    <span class="label">字号</span>
    <button id="btnFontMinus">A-</button>
    <span class="size" id="fontSize">19</span>
    <button id="btnFontPlus">A+</button>
    <span class="sep"></span>
    <button id="btnTop">全屏</button>
  </div>
  <div class="row">
    <span class="label">背景</span>
    <button class="sw on" data-bg="#FFFFFF"><i style="background:#FFFFFF"></i></button>
    <button class="sw" data-bg="#C7EDCC"><i style="background:#C7EDCC"></i></button>
    <button class="sw" data-bg="#CCE8FF"><i style="background:#CCE8FF"></i></button>
    <span class="label" id="paperHint" style="margin-left:6px">纸张背景可切换</span>
  </div>
</header>

<main><div id="paper"><textarea id="editor" placeholder="在这里码字…" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea></div></main>

<footer>
  <span>速度</span><b class="speed" id="speed">0</b><span>字/分</span>
  <span>·</span><span>累计已码</span><b id="session">0</b>
  <span>·</span><span>文档字数</span><b id="total">0</b>
  <span>·</span><span>净字数</span><b id="net">0</b>
  <span>·</span><span id="saved">已保存</span>
</footer>

<div class="mask" id="mask"></div>

<!-- 稿件抽屉 -->
<div class="sheet" id="docsSheet">
  <h3>写作 · 稿件<button id="btnNew" class="primary">新建</button></h3>
  <div class="hint">手机无法像电脑那样自由浏览文件夹，所以稿件存在本机（浏览器存储）里，可随时导出 txt。</div>
  <div class="body" id="docList"></div>
</div>

<!-- 输入统计抽屉 -->
<div class="sheet" id="statsSheet">
  <h3>输入统计<button id="btnStatsReset">重置</button></h3>
  <div class="hint">手机系统不允许后台统计物理按键（与电脑版全局键盘钩子不同），这里统计的是本次输入的字符频次。</div>
  <div class="body" id="charList"></div>
</div>

<script>
"use strict";
/* ================= 存储 ================= */
var LS_DOCS = "mazi_docs_v1";        // 稿件数组
var LS_CUR  = "mazi_cur_v1";         // 当前稿件 id
var LS_SET  = "mazi_set_v1";         // 界面设置

function loadJSON(k, d){ try{ var s = localStorage.getItem(k); return s ? JSON.parse(s) : d; }catch(e){ return d; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ================= 字数统计(与桌面版一致) ================= */
var PUNCT_RE = /[\u3000-\u303F\uFF00-\uFF0F\uFF1A-\uFF20\uFF3B-\uFF40\uFF5B-\uFF65\u2000-\u206F\u2E00-\u2E7F!-\/:-@\[-`{-~\u2018\u2019\u201C\u201D\u2026\u2014\u00B7\u00A7\u203B\u2234\u2235\u2605\u2606\u25CB\u25CF\u25C7\u25C6\u25A1\u25A0\u25B3\u25B2\u2192\u2190\u2191\u2193]/;
function isPunct(ch){
  if (PUNCT_RE.test(ch)) return true;
  var c = ch.codePointAt(0);
  if (c >= 0x3001 && c <= 0x303F) return true;   // CJK 标点
  if (c >= 0xFF01 && c <= 0xFF65) {
    // 全角字母数字不算标点,其余全角符号算
    if ((c >= 0xFF10 && c <= 0xFF19) || (c >= 0xFF21 && c <= 0xFF3A) || (c >= 0xFF41 && c <= 0xFF5A)) return false;
    return true;
  }
  return false;
}
function totalChars(text){
  var n = 0, i;
  for (i = 0; i < text.length; i++){
    var ch = text[i];
    if (ch === "\r" || ch === "\n" || ch === "\t" || ch === " " || ch === "\u3000" || /\s/.test(ch)) continue;
    n++;
  }
  return n;
}
function netChars(text){
  var n = 0, i;
  for (i = 0; i < text.length; i++){
    var ch = text[i];
    if (/\s/.test(ch)) continue;
    if (isPunct(ch)) continue;
    n++;
  }
  return n;
}

/* ================= 元素 ================= */
var editor = document.getElementById("editor");
var elSpeed = document.getElementById("speed");
var elSession = document.getElementById("session");
var elTotal = document.getElementById("total");
var elNet = document.getElementById("net");
var elSaved = document.getElementById("saved");
var elFileName = document.getElementById("fileName");
var elFontSize = document.getElementById("fontSize");

/* ================= 稿件管理 ================= */
var docs = loadJSON(LS_DOCS, null);
if (!docs || !docs.length){
  docs = [{ id: "d" + Date.now(), name: "新稿件", text: "", updated: Date.now() }];
  saveJSON(LS_DOCS, docs);
}
var curId = localStorage.getItem(LS_CUR) || docs[0].id;
function curDoc(){
  for (var i = 0; i < docs.length; i++) if (docs[i].id === curId) return docs[i];
  curId = docs[0].id; return docs[0];
}
function persist(showSaved){
  var d = curDoc();
  d.text = editor.value;
  d.updated = Date.now();
  saveJSON(LS_DOCS, docs);
  localStorage.setItem(LS_CUR, curId);
  if (showSaved){
    elSaved.textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
  }
}
function openDoc(id){
  curId = id;
  var d = curDoc();
  editor.value = d.text || "";
  elFileName.textContent = d.name;
  localStorage.setItem(LS_CUR, curId);
  sessionAdded = 0; typedSinceTick = 0; speedEma = 0; lastTypeAt = 0;
  tapBaseline();
  updateStats();
  renderDocList();
  editor.focus();
}

/* ================= 设置 ================= */
var settings = loadJSON(LS_SET, { fontSize: 19, indent: true, bg: "#FFFFFF", topmost: false });
function applySettings(){
  editor.style.fontSize = settings.fontSize + "px";
  elFontSize.textContent = settings.fontSize;
  document.getElementById("btnIndent").classList.toggle("on", !!settings.indent);
  document.getElementById("paper").style.background = settings.bg;
  var sws = document.querySelectorAll(".sw");
  for (var i = 0; i < sws.length; i++){
    sws[i].classList.toggle("on", sws[i].getAttribute("data-bg").toUpperCase() === settings.bg.toUpperCase());
  }
  saveJSON(LS_SET, settings);
}

/* ================= 统计与码速(3 秒采样 + 平滑) ================= */
var sessionAdded = 0, typedSinceTick = 0, speedEma = 0, lastTypeAt = 0;
var charCounts = loadJSON("mazi_chars_v1", {});

function tapBaseline(){ /* 复位采样基线 */ }

function updateStats(){
  var text = editor.value;
  elTotal.textContent = totalChars(text).toLocaleString();
  elNet.textContent = netChars(text).toLocaleString();
  elSession.textContent = sessionAdded.toLocaleString();
}
setInterval(function(){
  var instant = typedSinceTick * 20;      // 3 秒窗口 -> 字/分
  typedSinceTick = 0;
  speedEma = speedEma * 0.5 + instant * 0.5;
  var idle = Date.now() - lastTypeAt;
  var speed = (lastTypeAt && idle <= 9000) ? Math.round(speedEma) : 0;
  elSpeed.textContent = speed.toLocaleString();
}, 3000);

/* ================= 编辑器事件 ================= */
var applyingIndent = false;
editor.addEventListener("input", function(e){
  var text = editor.value;
  /* --- 自动缩进:检测刚插入的换行,补两个全角空格(不拦截回车,对输入法零干扰) --- */
  if (settings.indent && !applyingIndent && e.inputType !== "deleteContentBackward"){
    var pos = editor.selectionStart;
    if (pos > 0 && text.charAt(pos - 1) === "\n" && e.data && e.data.indexOf("\n") >= 0){
      applyingIndent = true;
      editor.value = text.slice(0, pos) + "\u3000\u3000" + text.slice(pos);
      editor.selectionStart = editor.selectionEnd = pos + 2;
      applyingIndent = false;
      text = editor.value;
    }
  }
  /* --- 累计已码 + 字符统计 + 码速采样 --- */
  if (!applyingIndent && e.data){
    var added = 0, i;
    for (i = 0; i < e.data.length; i++){
      var ch = e.data[i];
      if (/\s/.test(ch)) continue;
      added++;
      charCounts[ch] = (charCounts[ch] || 0) + 1;
    }
    if (added > 0){
      sessionAdded += added;
      typedSinceTick += added;
      lastTypeAt = Date.now();
      saveJSON("mazi_chars_v1", charCounts);
    }
  }
  updateStats();
  dirty = true;
  scheduleSave();
});

var dirty = false, saveTimer = null;
function scheduleSave(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ persist(true); dirty = false; }, 1000);
}
window.addEventListener("pagehide", function(){ if (dirty) persist(true); });
document.addEventListener("visibilitychange", function(){ if (document.hidden && dirty) persist(true); });

/* ================= 顶栏交互 ================= */
document.getElementById("btnIndent").onclick = function(){
  settings.indent = !settings.indent; applySettings();
};
document.getElementById("btnFontPlus").onclick = function(){
  settings.fontSize = Math.min(48, settings.fontSize + 2); applySettings();
};
document.getElementById("btnFontMinus").onclick = function(){
  settings.fontSize = Math.max(12, settings.fontSize - 2); applySettings();
};
var sws = document.querySelectorAll(".sw");
for (var i = 0; i < sws.length; i++){
  sws[i].onclick = function(){ settings.bg = this.getAttribute("data-bg"); applySettings(); };
}
/* 沉浸式全屏(手机浏览器可用时) */
var btnTop = document.getElementById("btnTop");
function syncFullscreen(){
  var fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  btnTop.textContent = fs ? "退出全屏" : "全屏";
  btnTop.classList.toggle("on", fs);
}
btnTop.onclick = function(){
  var el = document.documentElement, fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (fs){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  setTimeout(syncFullscreen, 300);
};
document.addEventListener("fullscreenchange", syncFullscreen);
document.addEventListener("webkitfullscreenchange", syncFullscreen);
syncFullscreen();

/* ================= 导入 / 导出 ================= */
document.getElementById("btnImport").onclick = function(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".txt,text/plain";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var buf = fr.result, text = null;
      /* 编码识别:严格 UTF-8 失败则按 GB18030(与桌面版一致) */
      try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
      catch (err){
        try { text = new TextDecoder("gb18030").decode(buf); }
        catch (e2){ text = new TextDecoder("utf-8").decode(buf); }
      }
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      docs.push({ id: "d" + Date.now(), name: f.name.replace(/\.txt$/i, ""), text: text, updated: Date.now() });
      saveJSON(LS_DOCS, docs);
      openDoc(docs[docs.length - 1].id);
      closeSheets();
    };
    fr.readAsArrayBuffer(f);
  };
  inp.click();
};
document.getElementById("btnExport").onclick = function(){
  var d = curDoc(); persist(false);
  var content = "\uFEFF" + editor.value.replace(/\r\n/g, "\n").replace(/\r/g, "\n").replace(/\n/g, "\r\n");
  var name = (d.name || "稿件") + ".txt";
  /* 安卓/鸿蒙外壳内:走原生保存,直接落到系统「下载」目录 */
  if (window.MaziAndroid && window.MaziAndroid.saveText){
    var msg = window.MaziAndroid.saveText(name, content);
    elSaved.textContent = msg;
    if (window.MaziAndroid.toast) window.MaziAndroid.toast(msg);
    return;
  }
  /* 鸿蒙外壳内:原生导出(弹出系统文件保存框) */
  if (window.MaziHarmony && window.MaziHarmony.saveText){
    elSaved.textContent = "正在导出…";
    window.MaziHarmony.saveText(name, content);
    return;
  }
  /* 浏览器内:走下载 */
  var blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  elSaved.textContent = "已导出 " + name;
};

/* ================= 抽屉:稿件 / 统计 ================= */
var mask = document.getElementById("mask");
function openSheet(id){
  closeSheets();
  document.getElementById(id).classList.add("open");
  mask.classList.add("on");
  if (window.MaziHarmony && window.MaziHarmony.setSheetOpen) window.MaziHarmony.setSheetOpen(true);
}
function closeSheets(){
  document.getElementById("docsSheet").classList.remove("open");
  document.getElementById("statsSheet").classList.remove("open");
  mask.classList.remove("on");
  if (window.MaziHarmony && window.MaziHarmony.setSheetOpen) window.MaziHarmony.setSheetOpen(false);
}
mask.onclick = closeSheets;
document.getElementById("btnDocs").onclick = function(){ renderDocList(); openSheet("docsSheet"); };
document.getElementById("btnStats").onclick = function(){ renderCharList(); openSheet("statsSheet"); };
document.getElementById("btnStatsReset").onclick = function(){
  charCounts = {}; saveJSON("mazi_chars_v1", charCounts); renderCharList();
};
document.getElementById("btnNew").onclick = function(){
  var name = prompt("稿件名称", "新稿件");
  if (name === null) return;
  name = (name || "").trim() || "新稿件";
  var d = { id: "d" + Date.now(), name: name, text: "", updated: Date.now() };
  docs.push(d); saveJSON(LS_DOCS, docs);
  openDoc(d.id);
  closeSheets();
};

function renderDocList(){
  var box = document.getElementById("docList");
  box.innerHTML = "";
  if (!docs.length){ box.innerHTML = '<div class="empty">还没有稿件</div>'; return; }
  docs.slice().sort(function(a, b){ return (b.updated || 0) - (a.updated || 0); }).forEach(function(d){
    var row = document.createElement("div");
    row.className = "doc" + (d.id === curId ? " cur" : "");
    var name = document.createElement("div");
    name.className = "name"; name.textContent = d.name;
    var meta = document.createElement("div");
    meta.className = "meta"; meta.textContent = (d.text || "").length + " 字";
    var rename = document.createElement("button"); rename.textContent = "改名";
    var del = document.createElement("button"); del.textContent = "删除";
    rename.onclick = function(e){
      e.stopPropagation();
      var n = prompt("重命名", d.name);
      if (n === null) return;
      d.name = (n || "").trim() || d.name;
      saveJSON(LS_DOCS, docs);
      if (d.id === curId) elFileName.textContent = d.name;
      renderDocList();
    };
    del.onclick = function(e){
      e.stopPropagation();
      if (!confirm("删除「" + d.name + "」？此操作不可撤销（可先导出备份）")) return;
      var idx = docs.indexOf(d);
      if (idx >= 0) docs.splice(idx, 1);
      if (!docs.length) docs.push({ id: "d" + Date.now(), name: "新稿件", text: "", updated: Date.now() });
      saveJSON(LS_DOCS, docs);
      if (curId === d.id) openDoc(docs[0].id); else renderDocList();
    };
    row.appendChild(name); row.appendChild(meta); row.appendChild(rename); row.appendChild(del);
    row.onclick = function(){ openDoc(d.id); closeSheets(); };
    box.appendChild(row);
  });
}
function renderCharList(){
  var box = document.getElementById("charList");
  var arr = [];
  for (var k in charCounts) if (charCounts.hasOwnProperty(k)) arr.push([k, charCounts[k]]);
  arr.sort(function(a, b){ return b[1] - a[1]; });
  if (!arr.length){ box.innerHTML = '<div class="empty">还没有输入记录</div>'; return; }
  var html = "";
  arr.slice(0, 60).forEach(function(p){
    html += '<div class="charline"><span>' + (p[0] === " " ? "空格" : p[0].replace(/&/g,"&amp;").replace(/</g,"&lt;")) + '</span><span>' + p[1] + ' 次</span></div>';
  });
  box.innerHTML = html;
}

/* ================= 安卓返回键:优先关闭抽屉 ================= */
window.maziBack = function(){
  if (document.getElementById("docsSheet").classList.contains("open") ||
      document.getElementById("statsSheet").classList.contains("open")){
    closeSheets();
    return true;
  }
  return false;
};

/* ================= 原生外壳回调(安卓/鸿蒙通用) ================= */
/* 鸿蒙侧导入文件后回调 */
window.maziImportFile = function(name, text){
  if (typeof text !== "string") return false;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  docs.push({ id: "d" + Date.now(), name: (name || "导入稿件").replace(/\.txt$/i, ""), text: text, updated: Date.now() });
  saveJSON(LS_DOCS, docs);
  openDoc(docs[docs.length - 1].id);
  closeSheets();
  return true;
};
/* 原生侧保存完成后回调 */
window.maziSaved = function(msg){
  if (msg) elSaved.textContent = msg;
};
/* 鸿蒙侧发起导入 */
document.getElementById("btnImport").addEventListener("click", function(ev){
  if (window.MaziHarmony && window.MaziHarmony.importFile){
    ev.stopImmediatePropagation();
    window.MaziHarmony.importFile();
  }
}, true);

/* ================= 启动 ================= */
applySettings();
openDoc(curId);
updateStats();
if (window.MaziAndroid && window.MaziAndroid.platform){
  elSaved.textContent = "安卓版 · 已就绪";
} else if (window.MaziHarmony && window.MaziHarmony.platform){
  elSaved.textContent = "鸿蒙版 · 已就绪";
}
</script>
</body>
</html>
